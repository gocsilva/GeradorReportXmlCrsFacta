[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-fatca-generator"
version = "0.1.0"
description = "Gerador desktop offline de XML CRS e FATCA a partir de Excel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.0",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
